[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "weathersummary"
version = "0.1.0"
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true